<title>Policenbetreuung.ch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Persönliche Betreuung für bestehende Versicherungs- und Vorsorgeverträge in der Schweiz.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap">
<style>
/* Layout concept: weisse Editorial-FinTech-Seite, schwebende Pill-Navigation, zentrierte Headline, darunter eine mehrschichtige Dokumentenkomposition auf dem Schreibtisch. Blau nur als Signal. */
:root{
  --bg:#f7fafc; --surface:#ffffff; --surface2:#f1f5f9; --ink:#1e1e1e; --ink2:#666666; --line:#ccd1da; --line2:#e4e8ef;
  --blue:#0098f2; --blue-ink:#0077c2; --blue-soft:#cfeafa; --midnight:#0d111b;
  --btn-bg:#0d111b; --btn-fg:#ffffff; --nav-bg:rgba(255,255,255,.96);
  --shadow-s:0 1px 2px rgba(13,17,27,.05),0 4px 14px rgba(13,17,27,.05);
  --shadow-m:0 2px 4px rgba(13,17,27,.05),0 14px 40px rgba(13,17,27,.09);
  --paper:#ffffff; --paper-ink:#1e1e1e; --paper-mute:#8a93a3; --paper-line:#e6e9ef; --paper-edge:rgba(13,17,27,.10);
  --desk:#eef2f6; --ok:#12a150; --err:#d6373b; --panel-dark:#0d111b; --panel-dark-ink:#f4f7fb;
  --font-d:'Outfit','Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --font-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d111b; --surface:#141a28; --surface2:#1a2132; --ink:#eef2f8; --ink2:#9aa4b5; --line:#2a3347; --line2:#1f2740;
  --blue:#3bb4ff; --blue-ink:#5cc4ff; --blue-soft:#12324a; --btn-bg:#ffffff; --btn-fg:#0d111b; --nav-bg:rgba(20,26,40,.96);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3); --shadow-m:0 2px 4px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45);
  --desk:#121827; --panel-dark:#05080f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d111b; --surface:#141a28; --surface2:#1a2132; --ink:#eef2f8; --ink2:#9aa4b5; --line:#2a3347; --line2:#1f2740;
  --blue:#3bb4ff; --blue-ink:#5cc4ff; --blue-soft:#12324a; --btn-bg:#ffffff; --btn-fg:#0d111b; --nav-bg:rgba(20,26,40,.96);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3); --shadow-m:0 2px 4px rgba(0,0,0,.35),0 14px 40px rgba(0,0,0,.45);
  --desk:#121827; --panel-dark:#05080f; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:500;letter-spacing:-.03em;line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin-inline:auto;width:100%}
.sec{padding-block:clamp(64px,9vw,120px)}
.sec.tight{padding-block:clamp(40px,6vw,72px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-ink)}
.pill-tag{display:inline-flex;text-align:center;line-height:1.35;padding:6px 14px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.h2{font-size:clamp(30px,4.4vw,50px)}
.h3{font-size:clamp(22px,2.4vw,28px)}
.lead{font-size:clamp(16px,1.5vw,19px);color:var(--ink2);max-width:62ch}
.center{text-align:center}.center .lead{margin-inline:auto}
.sec-head{display:flex;flex-direction:column;gap:16px;margin-bottom:clamp(32px,4vw,56px)}
.sec-head.center{align-items:center}

/* Buttons */
.nav-cta{white-space:nowrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:999px;border:1px solid transparent;background:var(--btn-bg);color:var(--btn-fg);font-weight:500;font-size:16px;text-decoration:none;transition:transform .25s ease,box-shadow .25s ease,opacity .2s;box-shadow:var(--shadow-s);line-height:1.2}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}
.btn .arr{transition:transform .25s ease;display:inline-block}
.btn:hover .arr,.link-arrow:hover .arr{transform:translateX(4px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--blue);box-shadow:none}
.btn.sm{padding:10px 18px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.link-arrow{text-align:left;display:inline-flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);text-decoration:none;background:none;border:0;padding:0}
.link-arrow .arr{transition:transform .25s}

/* Navigation */
.nav{position:fixed;z-index:50;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));display:flex;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px));pointer-events:none;animation:fadeIn .5s ease both}
.nav-pill{pointer-events:auto;display:flex;align-items:center;gap:12px;width:min(1120px,100%);padding:8px 8px 8px 20px;border-radius:999px;background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:var(--shadow-s)}
.logo{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-d);font-weight:600;font-size:18px;letter-spacing:-.02em;text-decoration:none;background:none;border:0;padding:0;white-space:nowrap}
.logo svg{flex:none}
.logo .tld{color:var(--blue-ink)}
.nav-links{display:flex;gap:2px;margin-left:8px;flex:1;min-width:0}
.nav-links button{background:none;border:0;padding:8px 10px;border-radius:999px;font-size:14px;color:var(--ink2);transition:color .2s,background .2s}
.nav-links button:hover,.nav-links button.on{color:var(--ink)}
.nav-links button.on{color:var(--blue-ink)}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.lang-btn,.theme-btn,.burger{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line2);border-radius:999px;padding:8px 12px;font-size:13px;color:var(--ink2)}
.lang-btn:hover,.theme-btn:hover{border-color:var(--blue);color:var(--ink)}
.burger{display:none;padding:9px 11px}
.lang-menu{position:absolute;right:0;top:calc(100% + 10px);width:210px;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow-m);padding:6px;display:none}
.lang-menu.open{display:block;animation:fadeIn .2s ease both}
.lang-menu button{display:flex;width:100%;justify-content:space-between;padding:9px 12px;background:none;border:0;border-radius:10px;font-size:14px;text-align:left}
.lang-menu button:hover,.lang-menu button.on{background:var(--surface2)}
.lang-wrap{position:relative}
.mobile-menu{position:fixed;inset:0;z-index:49;background:var(--bg);padding:calc(90px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-left,0px)) 24px;display:none;flex-direction:column;gap:6px}
.mobile-menu.open{display:flex;animation:fadeIn .25s ease both}
.mobile-menu button.m-link{background:none;border:0;border-bottom:1px solid var(--line2);text-align:left;font-family:var(--font-d);font-size:26px;padding:14px 0;letter-spacing:-.02em}

/* Hero */
.hero{padding-top:calc(130px + env(safe-area-inset-top,0px));position:relative}
.hero-text{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;max-width:900px;margin-inline:auto}
.hero h1{font-size:clamp(36px,6.4vw,70px);letter-spacing:-.035em}
.hero h1 span{display:block}
.hero .sub{font-size:clamp(16px,1.5vw,18px);color:var(--ink2);max-width:64ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.trust-row{display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;font-size:14px;color:var(--ink)}
.trust-row li{list-style:none;display:flex;align-items:center;gap:8px}
.trust-row{padding:0;margin:0}
.tick{width:18px;height:18px;border-radius:50%;background:var(--blue);display:inline-flex;align-items:center;justify-content:center;flex:none}
.tick svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none}
.hero .note{font-size:13px;color:var(--ink2)}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.stage-clip{position:relative;overflow:hidden;margin-top:36px;height:calc(560px*var(--k,1));-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.stage-scale{position:absolute;left:50%;top:0;width:1000px;height:560px;margin-left:-500px;transform-origin:50% 0;transform:translateY(calc(var(--p,0)*-46px + var(--ps,0)*-34px)) scale(calc(var(--k,1)*(1 - var(--ps,0)*.17)))}
.L{position:absolute;transform:translate3d(var(--px,0px),var(--py,0px),0);will-change:transform}
.E{animation:var(--enter,enterUp) var(--dur,.9s) var(--ease,cubic-bezier(.2,.7,.2,1)) both;animation-delay:var(--d,1s)}
.R{transform:perspective(1100px) rotateX(calc(var(--my,0)*-1.3deg*(1 - var(--ps,0)))) rotateY(calc(var(--mx,0)*1.7deg*(1 - var(--ps,0)))) rotate(calc(var(--r,0deg) + var(--pf,0)*var(--fan,0deg))) translate(calc(var(--pf,0)*var(--fx,0px)),calc(var(--pf,0)*var(--fy,0px)));transform-origin:50% 60%}
.F{animation:float 7s ease-in-out infinite alternate;animation-delay:var(--fd,2.4s)}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes enterUp{from{opacity:0;transform:translateY(90px) scale(.96)}to{opacity:1;transform:none}}
@keyframes enterLeft{from{opacity:0;transform:translateX(-110px)}to{opacity:1;transform:none}}
@keyframes enterRight{from{opacity:0;transform:translateX(110px)}to{opacity:1;transform:none}}
@keyframes enterDrop{from{opacity:0;transform:translateY(-70px) scale(1.03)}to{opacity:1;transform:none}}
@keyframes enterFade{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.stage-clip.hl .doc.dim{opacity:calc(1 - var(--p,0)*.4)}
.desk-shadow{position:absolute;left:150px;top:300px;width:700px;height:200px;background:radial-gradient(ellipse at center,rgba(13,17,27,.16),transparent 68%);filter:blur(6px)}

/* Document */
.doc{position:relative;width:270px;height:372px;background:var(--paper);color:var(--paper-ink);border-radius:5px;padding:20px 20px 16px;box-shadow:0 0 0 1px var(--paper-edge),0 2px 3px rgba(13,17,27,.08),0 18px 36px -8px rgba(13,17,27,.22),0 40px 70px -20px rgba(13,17,27,.22);overflow:hidden;font-family:var(--font-b);font-size:9.5px;line-height:1.4;text-align:left;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.45  0 0 0 0 0.5  0 0 0 .05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.doc.sm{width:210px;height:290px;padding:15px;font-size:8px}
.doc.lg{width:320px;height:440px;padding:24px;font-size:11px}
.doc .d-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.doc .d-logo{width:22px;height:22px;border-radius:6px;background:var(--blue);display:flex;align-items:center;justify-content:center}
.doc .d-logo svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.4}
.doc .d-tag{font-size:.8em;letter-spacing:.14em;color:var(--paper-mute);text-transform:uppercase;font-weight:600}
.doc .d-title{font-family:var(--font-d);font-weight:600;font-size:1.55em;letter-spacing:-.01em;line-height:1.12;margin-bottom:3px;color:var(--paper-ink)}
.doc .d-sub{color:var(--paper-mute);font-size:.95em;margin-bottom:12px}
.doc .d-rows{border-top:1px solid var(--paper-line)}
.doc .d-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--paper-line)}
.doc .d-row span:first-child{color:var(--paper-mute)}
.doc .d-row span:last-child{font-weight:600;text-align:right;color:var(--paper-ink)}
.doc .d-bars{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.doc .d-bars i{display:block;height:4.5px;border-radius:3px;background:var(--paper-line)}
.doc .d-chk{display:flex;gap:7px;align-items:center;padding:4px 0;color:var(--paper-ink)}
.doc .d-chk .tick{width:12px;height:12px}.doc .d-chk .tick svg{width:7px;height:7px}
.doc .d-stamp{position:absolute;right:12px;bottom:34px;transform:rotate(-14deg);border:1.5px solid rgba(0,152,242,.45);color:rgba(0,152,242,.55);font-weight:700;letter-spacing:.2em;font-size:1.25em;padding:2px 8px;border-radius:4px}
.doc .d-foot{position:absolute;left:20px;right:20px;bottom:11px;font-size:.78em;color:var(--paper-mute);display:flex;justify-content:space-between}
.doc.sm .d-foot{left:15px;right:15px}
.doc.lg .d-foot{left:24px;right:24px}
.doc .d-fold{position:absolute;top:0;right:0;width:26px;height:26px;background:linear-gradient(225deg,var(--desk) 50%,rgba(13,17,27,.08) 50%);}

.folder-back{width:520px;height:420px;border-radius:16px 16px 10px 10px;background:linear-gradient(#c9d0db,#b7c0cd);box-shadow:0 30px 60px -20px rgba(13,17,27,.35);position:relative}
.folder-back:before{content:"";position:absolute;left:0;top:-22px;width:170px;height:30px;border-radius:12px 12px 0 0;background:linear-gradient(#cfd6e0,#c9d0db)}
.folder-front{width:520px;height:210px;border-radius:6px 6px 14px 14px;background:linear-gradient(#dde2ea,#c9d0db);box-shadow:0 -6px 18px rgba(13,17,27,.12),0 30px 60px -20px rgba(13,17,27,.3);padding:22px 28px;display:flex;flex-direction:column;justify-content:flex-start;gap:3px}
.folder-front b{font-family:var(--font-d);font-size:13px;letter-spacing:.18em;color:#5b6577;font-weight:600}
.folder-front span{font-size:12px;color:#7a8497}
.cc{width:238px;height:132px;background:var(--paper);border-radius:10px;padding:14px 16px;box-shadow:0 0 0 1px var(--paper-edge),0 16px 34px -8px rgba(13,17,27,.3);color:var(--paper-ink);display:flex;flex-direction:column;gap:6px}
.cc .cc-top{display:flex;gap:10px;align-items:center}
.cc .av{width:38px;height:38px;border-radius:50%;background:var(--blue-soft);color:#0077c2;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:600;font-size:14px}
.cc .nm{font-weight:600;font-size:13px;line-height:1.2}.cc .rl{font-size:10.5px;color:var(--paper-mute)}
.cc .ln{font-size:10.5px;color:#4b5565;display:flex;align-items:center;gap:6px}
.cc .ln:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue)}
.cc .ex{font-size:8.5px;color:var(--paper-mute);margin-top:auto}
.keyboard{width:360px;height:190px;border-radius:14px;background:#f7f8fa;box-shadow:0 0 0 1px rgba(13,17,27,.08),0 20px 40px -10px rgba(13,17,27,.28);padding:12px;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(5,1fr);gap:5px}
.keyboard i{background:#fff;border-radius:4px;box-shadow:0 1px 0 rgba(13,17,27,.18),inset 0 0 0 1px rgba(13,17,27,.05)}
.keyboard i.w{grid-column:span 4}
.laptop{width:430px;height:300px;border-radius:18px;background:linear-gradient(135deg,#e7eaef,#c3c9d3 60%,#d6dae1);box-shadow:0 0 0 1px rgba(13,17,27,.12),0 30px 60px -16px rgba(13,17,27,.4);padding:30px 34px;position:relative}
.laptop .kb{position:absolute;left:34px;right:34px;top:30px;height:150px;border-radius:8px;background:#1b1f27;padding:8px;display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(5,1fr);gap:4px}
.laptop .kb i{background:#2a303b;border-radius:3px}
.laptop .tp{position:absolute;left:50%;margin-left:-70px;top:196px;width:140px;height:80px;border-radius:8px;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(13,17,27,.1)}

/* Cards / grids */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:26px;box-shadow:var(--shadow-s);min-width:0}
.panel{background:var(--surface);border:1px solid var(--line2);border-radius:32px;padding:clamp(24px,4vw,48px);box-shadow:var(--shadow-s);min-width:0}
.svc{display:flex;flex-direction:column;gap:14px;transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;cursor:default}
.svc:hover{transform:translateY(-4px);box-shadow:var(--shadow-m);border-color:var(--blue)}
.svc h3{font-size:22px;letter-spacing:-.02em}
.svc p{color:var(--ink2);font-size:15px}
.svc .ic{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;color:var(--blue-ink)}
.svc .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.svc:hover .ic svg{transform:rotate(-8deg) scale(1.15)}
.svc .link-arrow{margin-top:auto;padding-top:6px}
.svc:hover .link-arrow .arr{transform:translateX(5px)}
.reveal-pre{opacity:0;transform:translateY(24px)}
.reveal{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--sd,0s)}

/* Switchers */
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:6px;background:var(--surface2);border-radius:999px;width:max-content;max-width:100%}
.tabs button{background:none;border:0;padding:10px 20px;border-radius:999px;font-size:15px;font-weight:500;color:var(--ink2);transition:all .25s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.swap{transition:opacity .22s ease,transform .22s ease}
.swap.out{opacity:0;transform:translateY(8px) scale(.99)}
.sw-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.sw-visual{position:relative;height:460px;display:flex;align-items:center;justify-content:center;background:var(--desk);border-radius:24px;overflow:hidden}
.sw-visual .doc{position:absolute;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .35s}
.sw-visual .cc{position:absolute;right:6%;bottom:8%;transform:rotate(-4deg)}
.bul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.bul li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.bul .tick{margin-top:4px}
.camp-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:20px}
.camp-card{text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:22px 24px;display:flex;flex-direction:column;gap:8px;transition:all .3s;box-shadow:var(--shadow-s)}
.camp-card:hover{transform:translateY(-3px);border-color:var(--blue)}
.camp-card[aria-selected="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft),var(--shadow-m)}
.camp-card .lbl{font-family:var(--font-d);font-size:20px;letter-spacing:-.02em;font-weight:500}
.camp-card .sm{font-size:14px;color:var(--ink2)}
.camp-card .cn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-ink);font-weight:600}
.camp-panel .h3{font-size:clamp(24px,3vw,34px);margin-bottom:16px}
.camp-panel .txt{color:var(--ink2);margin-bottom:20px}
.sit-h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;transition:all .2s}
button.chip:hover{border-color:var(--blue)}
.chip.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-ink)}
.camp-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}

/* Recognition */
.quotes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.quote{text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:20px;font-family:var(--font-d);font-size:19px;letter-spacing:-.015em;line-height:1.25;display:flex;flex-direction:column;gap:16px;justify-content:space-between;transition:all .25s;box-shadow:var(--shadow-s)}
.quote small{font-family:var(--font-b);font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px;letter-spacing:0}
.quote small i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;transition:all .2s;flex:none}
.quote small i svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.quote:hover{transform:translateY(-3px);border-color:var(--blue)}
.quote[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.quote[aria-pressed="true"] small i{background:var(--blue);border-color:var(--blue)}
.quote[aria-pressed="true"] small i svg{opacity:1}
.quote[aria-pressed="true"]{color:var(--ink)}
.quote-bar{margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:18px 22px}

/* Vorsorge */
.pv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.pv .big{grid-column:span 2}.pv .small{grid-column:span 3}
.pcard{display:flex;flex-direction:column;gap:14px;overflow:hidden;padding:0}
.pcard .pv-vis{background:var(--desk);height:230px;position:relative;overflow:hidden;display:flex;justify-content:center}
.pcard .pv-vis .doc{position:absolute;top:26px;transform:rotate(var(--rr,-3deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .pv-vis .doc{transform:rotate(0deg) translateY(-8px)}
.pcard .body{padding:0 24px 24px;display:flex;flex-direction:column;gap:12px;flex:1}
.pcard h3{font-size:24px;letter-spacing:-.02em}
.pcard p{color:var(--ink2);font-size:15px}
.pcard .link-arrow{margin-top:auto;padding-top:6px}
.small .pv-vis{height:190px}

/* Language */
.lang-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:center}
.lang-big{font-family:var(--font-d);font-size:clamp(28px,4vw,46px);letter-spacing:-.03em;line-height:1.1;margin-bottom:18px}
.lang-desc{color:var(--ink2);margin-bottom:24px;max-width:56ch}
.avail{font-size:13px;color:var(--ink2);margin-top:16px}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;position:relative}
.step{text-align:left;background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;transition:all .3s;position:relative;overflow:hidden}
.step[aria-selected="true"]{border-color:var(--blue);box-shadow:var(--shadow-m)}
.step .sn{width:34px;height:34px;border-radius:50%;background:var(--surface2);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:600;transition:all .3s}
.step[aria-selected="true"] .sn{background:var(--blue);color:#fff}
.step h3{font-size:22px}.step p{color:var(--ink2);font-size:15px}
.step .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--blue);width:0}
.step[aria-selected="true"] .bar{animation:bar 4.5s linear forwards}
@keyframes bar{from{width:0}to{width:100%}}
.step-vis{margin-top:16px;height:340px;background:var(--desk);border-radius:24px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.step-vis .doc{position:absolute;transition:all .5s cubic-bezier(.2,.7,.2,1)}
.step-vis .cc{position:absolute;transition:all .5s cubic-bezier(.2,.7,.2,1)}

/* Trust */
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.val .ic{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.val .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.val h3{font-size:22px;margin-bottom:8px}.val p{color:var(--ink2);font-size:15px}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:16px;border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:var(--surface)}
.ladder>div{padding:20px 22px;border-right:1px solid var(--line2);font-size:14px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.ladder>div:last-child{border-right:0}
.ladder b{font-family:var(--font-d);color:var(--ink);font-size:17px;font-weight:500}
.ladder .tg{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.ladder .yes .tg{color:var(--ok)}.ladder .cond .tg{color:var(--blue-ink)}
.cfg{margin-top:16px;border:1.5px dashed var(--line);border-radius:20px;padding:22px 24px;display:flex;gap:18px;align-items:flex-start;color:var(--ink2);font-size:14px}
.cfg b{color:var(--ink);font-family:var(--font-d);font-size:17px;font-weight:500;display:block;margin-bottom:4px}
.flag{display:inline-block;background:#fff3cd;color:#6b4e00;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;letter-spacing:.04em;margin-left:6px;vertical-align:middle}
:root[data-theme="dark"] .flag{background:#3a2e08;color:#ffd96a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flag{background:#3a2e08;color:#ffd96a}}

/* Form */
.form-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,4vw,56px);align-items:start}
.form-side{display:flex;flex-direction:column;gap:20px;position:sticky;top:110px}
.form-side .sw-visual{height:340px}
.form-card{background:var(--surface);border:1px solid var(--line2);border-radius:32px;padding:clamp(22px,3.4vw,40px);box-shadow:var(--shadow-m);min-width:0}
.demo-banner{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:10px 14px;margin-bottom:22px}
.demo-banner b{color:var(--ink)}
.prog{display:flex;gap:6px;margin-bottom:8px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;position:relative}
.prog i:after{content:"";position:absolute;inset:0;background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .45s ease}
.prog i.done:after,.prog i.cur:after{transform:scaleX(1)}
.prog i.cur:after{opacity:.55}
.prog-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:22px}
.fstep{animation:fstep .4s ease both}
@keyframes fstep{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.fstep.back{animation-name:fstepb}
@keyframes fstepb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.fq{font-family:var(--font-d);font-size:clamp(22px,2.6vw,28px);letter-spacing:-.02em;margin-bottom:18px;line-height:1.15}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:all .2s;font-size:15.5px;text-align:left;width:100%;position:relative}
.opt:hover{border-color:var(--blue)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;transition:all .2s}
.opt.multi .ck{border-radius:6px}
.opt .ck svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.opt.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--ink)}
.opt.sel .ck{background:var(--blue);border-color:var(--blue)}
.opt.sel .ck svg{opacity:1}
.opt:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:500;color:var(--ink2)}
.fld input,.fld select{font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.fld.bad input,.fld.bad select{border-color:var(--err)}
.ferr{color:var(--err);font-size:13px;margin-top:10px;min-height:0}
.fld .ferr{margin-top:0}
.fnav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;align-items:center}
.consent-box{background:var(--surface2);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--ink2);margin-bottom:16px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;margin-bottom:12px;cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--blue);flex:none}
.chk.bad{color:var(--err)}
.success{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0}
.success .big-ck{width:76px;height:76px;border-radius:50%;background:var(--blue-soft);display:flex;align-items:center;justify-content:center}
.success svg{width:38px;height:38px;stroke:var(--blue);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.success .big-ck{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.success h3{font-size:28px}
.lead-id{font-size:12.5px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:8px 12px}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* FAQ */
.faq{max-width:860px;margin-inline:auto;display:flex;flex-direction:column}
.faq-i{border-bottom:1px solid var(--line2)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;background:none;border:0;padding:20px 0;font-family:var(--font-d);font-size:clamp(18px,2vw,21px);letter-spacing:-.015em;text-align:left}
.faq-q .pm{width:26px;height:26px;position:relative;flex:none}
.faq-q .pm:before,.faq-q .pm:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;margin:-1px 0 0 -7px;background:var(--ink);transition:transform .3s}
.faq-q .pm:after{transform:rotate(90deg)}
.faq-q[aria-expanded="true"] .pm:after{transform:rotate(0)}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.faq-a.open{grid-template-rows:1fr}
.faq-a>div{overflow:hidden}
.faq-a p{padding:0 40px 22px 0;color:var(--ink2);font-size:16px}

/* Final CTA */
.final{background:var(--panel-dark);color:var(--panel-dark-ink);border-radius:32px;padding:clamp(32px,5vw,72px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;overflow:hidden;position:relative}
.final h2{font-size:clamp(30px,4.2vw,50px)}
.final p{color:#aeb7c6;margin:18px 0 28px;max-width:52ch}
.final .btn{background:#fff;color:#0d111b}
.final-vis{position:relative;height:320px}
.final-vis .doc{position:absolute}
.final-vis .cc{position:absolute}

/* Footer */
.foot{border-top:1px solid var(--line2);padding-block:48px 40px;margin-top:40px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:32px}
.foot h4{font-size:14px;font-family:var(--font-b);letter-spacing:.02em;font-weight:600;margin-bottom:12px}
.foot ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.foot li button,.foot li a{background:none;border:0;padding:0;color:var(--ink2);font-size:14px;text-align:left;text-decoration:none}
.foot li button:hover,.foot li a:hover{color:var(--ink)}
.foot .legal{font-size:12.5px;color:var(--ink2);max-width:90ch}

/* Modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(13,17,27,.55);display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex;animation:fadeIn .25s ease both}
.modal-card{background:var(--surface);color:var(--ink);border-radius:24px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow-m)}
.modal-card h3{font-size:28px;margin-bottom:14px}
.modal-card h4{font-size:17px;margin:18px 0 6px}
.modal-card p,.modal-card li{color:var(--ink2);font-size:15px}
.modal-x{float:right;background:var(--surface2);border:0;width:36px;height:36px;border-radius:50%;font-size:18px}

/* Landing pages */
.prob-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.prob{display:flex;gap:14px;align-items:flex-start;padding:20px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;font-size:15.5px}
.prob .n{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue-ink);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-d);font-weight:600}
.crumb{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);background:none;border:0;padding:0;margin-bottom:6px}
.crumb:hover{color:var(--ink)}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:var(--nav-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line2);display:none;justify-content:center}

/* CRM demo */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line2);border-radius:16px;background:var(--surface)}
table.crm{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
.crm th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:12px 14px;border-bottom:1px solid var(--line2);font-weight:600}
.crm td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.crm select,.crm input{font:inherit;font-size:13.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:170px}
pre.json{background:var(--panel-dark);color:#cfe3f5;border-radius:16px;padding:18px;overflow:auto;font-size:12.5px;line-height:1.5;max-height:340px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;background:var(--surface2);color:var(--ink2)}

@media (max-width:1180px){.lang-btn .ln-name{display:none}}
@media (max-width:1020px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.quotes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav-links{display:none}.burger{display:inline-flex}.nav-cta{display:none}
  .pv{grid-template-columns:repeat(2,minmax(0,1fr))}.pv .big,.pv .small{grid-column:span 1}.pv .small:last-child{grid-column:span 2}
  .foot-grid{grid-template-columns:1fr 1fr}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}.ladder>div:nth-child(2){border-right:0}.ladder>div:nth-child(-n+2){border-bottom:1px solid var(--line2)}
}
@media (max-width:820px){
  body{font-size:16px}
  .g3,.g2,.vals,.steps,.prob-grid,.camp-cards,.pv{grid-template-columns:minmax(0,1fr)}
  .pv .small:last-child{grid-column:auto}
  .sw-grid,.lang-grid,.form-grid,.final{grid-template-columns:minmax(0,1fr)}
  .form-side{position:static}.form-side .sw-visual{display:none}
  .sw-visual{height:380px}
  .fields{grid-template-columns:minmax(0,1fr)}
  .tabs{border-radius:20px}
  .final-vis{height:260px}
  .hero{padding-top:calc(104px + env(safe-area-inset-top,0px))}
  .sticky-cta.on{display:flex}
}
@media (max-width:560px){.quotes{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:minmax(0,1fr)}.foot-grid{grid-template-columns:minmax(0,1fr)}.ladder{grid-template-columns:minmax(0,1fr)}.ladder>div{border-right:0;border-bottom:1px solid var(--line2)}.nav-pill{padding-left:14px}.lang-btn .ln-name{display:none}.theme-btn{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .L{will-change:auto}
}
[data-fit]{position:relative;overflow:hidden}
.fit-in{position:relative;transform-origin:0 0}
.sw-visual{height:auto;display:block}
.pcard .pv-vis,.step-vis{display:block}
.final-vis{display:block;height:auto}
.stage-clip{width:100vw;margin-left:calc(50% - 50vw)}
.sw-visual .doc,.step-vis .doc,.final-vis .doc{position:absolute}
.step-vis .cc,.final-vis .cc,.sw-visual .cc{position:absolute}
@media (max-width:820px){.sw-visual{height:auto}.final-vis{height:auto}}
.hero h1{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
@media (max-width:420px){.nav-pill{padding:6px 6px 6px 12px;gap:6px}.logo{font-size:15px;gap:6px}.logo svg{width:22px;height:22px}.lang-btn,.burger{padding:8px 9px}.nav-right{gap:5px}.hero h1{font-size:clamp(30px,9vw,40px)}}
.co-wrap{margin-top:22px}
.co-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.co-head label{font-size:13px;font-weight:500;color:var(--ink2)}
.co-count{font-size:12.5px;color:var(--blue-ink);font-weight:600}
.co-box{border:1px solid var(--line);border-radius:14px;background:var(--bg);overflow:hidden}
.co-box input[type=search]{font:inherit;font-size:16px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none}
.co-box input[type=search]:focus{box-shadow:inset 0 0 0 2px var(--blue-soft)}
.co-list{max-height:236px;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain}
.co-list .opt{padding:10px 12px;border-radius:10px;font-size:15px}
.co-list .opt[hidden]{display:none}
.co-empty{padding:12px;color:var(--ink2);font-size:14px}

.quick-line{font-size:14.5px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.quick-line .link-arrow{font-size:14.5px;color:var(--blue-ink);text-decoration:underline;text-underline-offset:3px}
.qband{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.qband .ic{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue-ink);display:flex;align-items:center;justify-content:center}
.qband .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qband h3{font-size:clamp(22px,2.4vw,28px)}.qband p{color:var(--ink2);font-size:15.5px}.qband small{font-size:12.5px;color:var(--ink2)}
.qband.hot{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft),var(--shadow-m)}
.qband .btn{margin-top:auto}
@media (max-width:1280px){.nav-call{display:none}}
#qcard .tabs{width:100%}#qcard .tabs button{flex:1}
@media (max-width:1500px){.lang-btn .ln-name{display:none}}
@media (max-width:1360px){.nav-call{display:none}}

.topics-wrap{position:relative;display:flex}
.nav-links .topics-wrap>button{display:inline-flex;gap:5px;align-items:center}
.nav-links .topics-wrap>button.on{color:var(--blue-ink)}
.topics-wrap .chev{font-size:10px;transition:transform .2s}
.topics-wrap>button[aria-expanded="true"] .chev{transform:rotate(180deg)}
.topics-menu{position:absolute;left:-10px;top:calc(100% + 16px);width:340px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow-m);padding:8px;display:none;flex-direction:column;gap:2px;z-index:60}
.topics-menu.open{display:flex;animation:fadeIn .2s ease both}

function doc(kind,o={}){
  const d=DOCS[kind]||DOCS.leben,cls=(o.size?' '+o.size:'')+(o.dim?' dim':'');
  const rows=(d.rows||[]).map(r=>`<div class="d-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
  const chk=(d.checks||[]).map(c=>`<div class="d-chk">${TICK}<span>${c}</span></div>`).join('');
  const b=BARS[(o.v||0)%3].map(w=>`<i style="width:${w}%"></i>`).join('');
  return `<div class="doc${cls}" ${o.style?`style="${o.style}"`:''}><div class="d-fold"></div>
  <div class="d-top"><span class="d-logo"><svg viewBox="0 0 12 12"><path d="m2.5 6.3 2.4 2.4 4.6-5"/></svg></span><span class="d-tag">${d.tag}</span></div>
  <div class="d-title">${d.title}</div><div class="d-sub">${d.sub}</div>
  ${chk?`<div class="d-rows" style="padding-top:6px">${chk}</div>`:''}${rows?`<div class="d-rows">${rows}</div>`:''}<div class="d-bars">${b}</div>

}

const FAQ=[
 ['Was ist Policenbetreuung.ch?','Policenbetreuung.ch ist eine Schweizer Plattform, bei der Sie eine Betreuungsanfrage für bereits abgeschlossene Versicherungs- und Vorsorgeverträge stellen können. Wir prüfen Ihre Angaben und helfen, einen passenden persönlichen Ansprechpartner zu finden.'],
 ['Für wen ist die Plattform gedacht?','Für Menschen mit bestehenden Policen, die keinen erreichbaren Ansprechpartner mehr haben, ihre Vorsorge in ihrer Muttersprache besprechen möchten oder sich eine bessere und persönlichere Betreuung wünschen.'],
 ['Kann ich mich melden, obwohl ich bereits einen Berater habe?','Ja. Die Plattform richtet sich ausdrücklich auch an Kunden mit Berater, die zum Beispiel nur bei Neuabschlüssen kontaktiert werden, eine bessere Erreichbarkeit wünschen oder eine zweite Einschätzung möchten.'],
 ['Kann ich meinen Versicherungsberater wechseln?','Unter Umständen ja. Wir klären mit Ihnen, welche Möglichkeiten bestehen. Ob und wie ein Betreuerwechsel möglich ist, hängt vom Vertrag, der Gesellschaft und dem Partner ab. Eine Zusage geben wir im Voraus nicht.'],
 ['Muss ich eine neue Versicherung abschliessen?','Nein. Die Betreuungsanfrage verpflichtet Sie nicht zum Abschluss einer neuen Versicherung. Ein Neuabschluss oder Produktwechsel ist keine Voraussetzung.'],
 ['Bleiben meine bestehenden Verträge bestehen?','Ihre Verträge werden durch die Anfrage nicht verändert. Änderungen an Verträgen erfolgen nur, wenn Sie diese ausdrücklich wünschen und beauftragen.'],
 ['Kann jede Police durch einen anderen Berater betreut werden?','Nicht jede. Ob eine Betreuung möglich ist, hängt unter anderem vom Produkt, der Versicherungsgesellschaft und den Vorgaben im Einzelfall ab. Wir klären das nach Ihrer Anfrage.'],
 ['Was passiert, wenn mein bisheriger Berater nicht erreichbar ist?','Teilen Sie uns in der Anfrage mit, was Sie über Ihre Police und die frühere Betreuung wissen. Wir helfen bei der Suche nach einem passenden neuen Ansprechpartner. Eine Policennummer ist dafür keine Pflicht.'],
 ['Kann ich Beratung in meiner Muttersprache erhalten?','Sie können Ihre Anfrage in 13 Sprachen stellen. Ob in Ihrer Region und Sprache ein Ansprechpartner zur Verfügung steht, prüfen wir im Einzelfall. Verfügbarkeiten sind konfigurierbar und werden nicht garantiert.'],
 ['Welche Vorsorgebereiche werden berücksichtigt?','Lebensversicherung, Säule 3a, Säule 3b, Pensionskasse (allgemeine Orientierung), Freizügigkeit sowie weitere Versicherungen.'],
 ['Ist die Anfrage kostenlos?','Die Anfrage ist kostenlos und unverbindlich. Kommt später ein Maklermandat mit der Wertenburg GmbH zustande, ist deren Dienstleistung für Sie kostenlos, sofern nichts Anderweitiges vereinbart wurde und das Mandat mindestens ein Kalenderjahr besteht. Die Wertenburg GmbH wird von den Gesellschaften mit branchenüblichen Ansätzen entschädigt.'],
 ['Wer erhält meine Daten?','Zunächst nur wir. Eine Weitergabe an einen geeigneten Betreuungspartner erfolgt ausschliesslich mit Ihrer ausdrücklichen Einwilligung. Details stehen im Hinweis vor dem Absenden und in der Datenschutzerklärung.'],
 ['Wie wird ein Ansprechpartner ausgewählt?','Wir berücksichtigen Ihre Situation, die Art Ihrer Policen, Ihre Region und Sprache sowie die Verfügbarkeit geprüfter Partner. Ihre Anfrage leiten wir an die Wertenburg GmbH weiter, die sich danach separat bei Ihnen meldet.'],
 ['Was passiert, wenn keine passende Betreuung verfügbar ist?','Dann informieren wir Sie offen darüber. Für Sie entstehen keine Kosten und keine Verpflichtungen, und Ihre bestehenden Verträge bleiben unverändert.']
];

 privacy:{t:'Datenschutzerklärung',h:`<h4>1. Verantwortliche und Kontakt</h4><p>Verantwortlich für die Bearbeitung von Personendaten auf dieser Website ist die Esche Consulting GmbH, Städtle 35, 9490 Vaduz, Liechtenstein (Handelsregister FL-0002.747.099-3), E-Mail <a href="mailto:anfrage@policenbetreuung.ch">anfrage@policenbetreuung.ch</a>, Telefon <a href="tel:+4237987733">+423 798 77 33</a>. Wir sind als externe Marketingdienstleisterin im Auftrag der Wertenburg GmbH tätig. Alle Anliegen zum Datenschutz richten Sie bitte an diese E-Mail-Adresse.</p><h4>2. Anwendbares Recht</h4><p>Wir bearbeiten Personendaten nach dem Schweizer Bundesgesetz über den Datenschutz (DSG), dem liechtensteinischen Datenschutzgesetz und, soweit anwendbar, der EU-Datenschutz-Grundverordnung (DSGVO).</p><h4>3. Welche Daten wir bearbeiten</h4><p>Wenn Sie das Formular absenden, bearbeiten wir:</p><ul><li>Ihre Angaben zur Situation und zur Police (Situation, Art der Police, Versicherungsgesellschaft, Bandbreiten zu Alter und Prämie, Beratungsthemen);</li><li>Name, Telefonnummer, Postleitzahl, freiwillig E-Mail-Adresse, Kanton, bevorzugte Kontaktzeit und Kontaktsprache sowie Ihre Nachricht;</li><li>falls Sie das Maklermandat bestätigen: Strasse und Ort, Zeitpunkt der Bestätigung und die Version des Mandatstexts;</li><li>den Nachweis Ihrer Einwilligung (Text, Version, Zeitpunkt);</li><li>Kampagnenangaben aus dem Link, über den Sie kamen (z. B. UTM-Parameter); die Google-Klick-ID nur mit Ihrer Statistik-Einwilligung.</li></ul><p>Beim blossen Besuch der Website fallen technische Daten an (IP-Adresse, Datum und Uhrzeit, aufgerufene Seite, Browser und Betriebssystem). Wir verlangen keine besonders schützenswerten Personendaten. Bitte schreiben Sie keine Gesundheitsdaten in das Nachrichtenfeld.</p><h4>4. Zwecke und Rechtsgrundlagen</h4><ul><li>Bearbeitung Ihrer Anfrage und Weiterleitung an die Wertenburg GmbH: auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 6 DSG; Art. 6 Abs. 1 lit. a DSGVO) und zur Durchführung Ihrer Anfrage (Art. 6 Abs. 1 lit. b DSGVO).</li><li>Vorbereitung des Maklermandats: nur, wenn Sie es ausdrücklich bestätigen; Grundlage ist Ihre Einwilligung.</li><li>Betrieb und Sicherheit der Website, Missbrauchsabwehr: berechtigtes Interesse (Art. 31 DSG; Art. 6 Abs. 1 lit. f DSGVO).</li><li>Statistik und Messung von Werbeanzeigen (Google): ausschliesslich mit Ihrer Einwilligung über die Cookie-Einstellungen.</li><li>Optionale Informationen per E-Mail: nur mit Ihrer gesonderten, freiwilligen Einwilligung.</li></ul><h4>5. Weitergabe an die Wertenburg GmbH</h4><p>Wir leiten Ihre Anfrage ausschliesslich an die Wertenburg GmbH, Wuhrstrasse 6, 9490 Vaduz, Liechtenstein, weiter (Versicherungsmaklerin, FMA-Registernummer 338879). Die Wertenburg GmbH nimmt danach separat mit Ihnen Kontakt auf. Sie ist für ihre Bearbeitung Ihrer Daten selbst verantwortlich, darf diese nur zur Bearbeitung Ihrer Anfrage verwenden und nicht für Werbung. Für die Bearbeitung durch die Wertenburg GmbH gilt deren eigene Datenschutzerklärung. Eine Weitergabe an andere Unternehmen oder ein Verkauf Ihrer Daten findet nicht statt.</p><h4>6. Weitere Empfänger</h4><ul><li>Hosting: Infomaniak Network SA, Rue Eugène-Marziano 25, 1227 Genf, Schweiz, betreibt als Auftragsbearbeiterin die Server dieser Website in der Schweiz.</li><li>Google Ireland Limited / Google LLC: nur wenn Sie in den Cookie-Einstellungen der Statistik zustimmen (siehe Ziffer 8).</li><li>Behörden und Gerichte: nur, wenn wir gesetzlich dazu verpflichtet sind.</li></ul><h4>7. Server-Logfiles, Browser-Speicher und Cookies</h4><p>Beim Aufruf speichert der Hosting-Anbieter technische Zugriffsdaten (u. a. IP-Adresse) für eine begrenzte Zeit, um die Sicherheit und Stabilität zu gewährleisten. Wir setzen keine Cookies zur Wiedererkennung oder für Werbung. Technisch notwendig sind der Sitzungsspeicher Ihres Browsers (Zwischenspeicherung des Formulars während Ihres Besuchs, Anzeige der Startanimation) und der lokale Speicher für Ihre Cookie-Auswahl. Der Sitzungsspeicher wird beim Schliessen des Browsers gelöscht, den lokalen Speicher können Sie jederzeit in Ihrem Browser löschen. Ihre Einwilligungen zur Weitergabe geben Sie bei jeder Anfrage neu.</p><h4>8. Statistik und Anzeigenmessung (nur mit Einwilligung)</h4><p>Wenn Sie in den Cookie-Einstellungen zustimmen, messen wir mit Google (Google Tag Manager, Google Ads) den Erfolg unserer Anzeigen. Dabei werden die Google-Klick-ID und Ereignisse wie «Formularschritt erreicht» übermittelt, nie aber Name, E-Mail-Adresse, Telefonnummer oder Policendaten. Google kann Daten in die USA übermitteln; dies stützt sich auf den Angemessenheitsbeschluss zum Datenschutzrahmen (Data Privacy Framework) bzw. Standardvertragsklauseln. Ohne Ihre Zustimmung werden diese Dienste nicht geladen. Sie können die Einwilligung jederzeit über «Cookie-Einstellungen» in der Fusszeile widerrufen.</p><h4>9. Schriften</h4><p>Die verwendeten Schriften sind in die Website eingebettet. Es besteht keine Verbindung zu Google Fonts oder anderen Schriftanbietern.</p><h4>10. Datenübermittlung ins Ausland</h4><p>Wir und die Wertenburg GmbH sitzen in Liechtenstein, das Hosting erfolgt in der Schweiz. Beide Länder gelten für die Schweiz und die EU als Länder mit angemessenem Datenschutz. Eine Übermittlung in Drittländer erfolgt nur im Rahmen von Ziffer 8 und mit Ihrer Einwilligung.</p><h4>11. Aufbewahrung</h4><p>Wir speichern Ihre Anfrage nur so lange, wie es für die Weiterleitung und die Klärung der Bearbeitung nötig ist, und löschen sie spätestens zwölf Monate danach, soweit keine gesetzliche Aufbewahrungspflicht entgegensteht. Den Nachweis Ihrer Einwilligung bewahren wir zu Beweiszwecken bis zu drei Jahre auf. Für die Daten bei der Wertenburg GmbH gelten deren Fristen und die gesetzlichen Aufbewahrungspflichten.</p><h4>12. Datensicherheit</h4><p>Die Übermittlung erfolgt verschlüsselt (TLS). Wir treffen angemessene technische und organisatorische Massnahmen, damit Ihre Daten vor Verlust, Missbrauch und unbefugtem Zugriff geschützt sind. Eine vollständige Sicherheit bei der Übertragung über das Internet kann nicht garantiert werden.</p><h4>13. Ihre Rechte</h4><p>Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Bearbeitung, Herausgabe bzw. Übertragung Ihrer Daten und Widerspruch gegen die Bearbeitung. Eine erteilte Einwilligung können Sie jederzeit mit Wirkung für die Zukunft widerrufen. Schreiben Sie dazu an <a href="mailto:anfrage@policenbetreuung.ch">anfrage@policenbetreuung.ch</a>; wir können einen Identitätsnachweis verlangen. Sie haben zudem das Recht, sich bei einer Aufsichtsbehörde zu beschweren:</p><ul><li>Eidgenössischer Datenschutz- und Öffentlichkeitsbeauftragter (EDÖB), Feldeggweg 1, 3003 Bern, <a href="https://www.edoeb.admin.ch" target="_blank" rel="noopener">www.edoeb.admin.ch</a>;</li><li>Datenschutzstelle Fürstentum Liechtenstein, Städtle 38, Postfach 684, 9490 Vaduz.</li></ul><h4>14. Automatisierte Entscheidungen, Minderjährige</h4><p>Es findet keine automatisierte Einzelentscheidung und kein Profiling statt. Das Angebot richtet sich an volljährige Personen.</p><h4>15. Änderungen</h4><p>Wir können diese Erklärung anpassen. Es gilt die jeweils auf der Website veröffentlichte Fassung. Stand: 2. November 2026.</p>`},
 agb:{t:'Nutzungsbedingungen & Haftung',h:`
<h4>1. Angebot</h4><p>Über policenbetreuung.ch können Sie eine kostenlose und unverbindliche Anfrage zu einer bestehenden Lebensversicherung oder Vorsorgepolice stellen. Mit der Anfrage entsteht kein Vertrag mit uns und keine Verpflichtung für Sie.</p>

<h4>4. Ihre Angaben</h4><p>Sie sind dafür verantwortlich, dass Ihre Angaben im Formular wahr und vollständig sind und dass Sie berechtigt sind, die Anfrage zu stellen.</p>
<h4>5. Haftung</h4><p>Wir erstellen die Inhalte mit Sorgfalt, übernehmen aber keine Gewähr für Vollständigkeit, Richtigkeit, Aktualität und ununterbrochene Verfügbarkeit der Website. Soweit gesetzlich zulässig, schliessen wir die Haftung für Schäden aus, die aus der Nutzung der Website, aus dem Ausbleiben oder der Verzögerung einer Kontaktaufnahme oder aus Leistungen, Auskünften und Empfehlungen der Wertenburg GmbH oder anderer Dritter entstehen, sowie für leichte Fahrlässigkeit und für indirekte Schäden und Folgeschäden. Unberührt bleibt die Haftung für Absicht und grobe Fahrlässigkeit sowie jede Haftung, die nach zwingendem Recht nicht ausgeschlossen oder beschränkt werden kann.</p>
<h4>6. Links zu Dritten</h4><p>Für Inhalte externer Websites, auf die wir verweisen, sind deren Betreiber verantwortlich.</p>
<h4>7. Urheberrechte</h4><p>Texte, Grafiken, Bilder und Marken dieser Website sind urheber- und kennzeichenrechtlich geschützt. Eine Verwendung ausserhalb der Nutzung der Website bedarf unserer vorherigen schriftlichen Zustimmung.</p>
<h4>8. Anwendbares Recht und Gerichtsstand</h4><p>Es gilt liechtensteinisches Recht unter Ausschluss des Kollisionsrechts. Gerichtsstand ist Vaduz, soweit nicht zwingende Bestimmungen, insbesondere zum Schutz von Konsumentinnen und Konsumenten an ihrem Wohnsitz, etwas anderes vorsehen.</p>
<h4>9. Änderungen</h4><p>Wir können diese Bedingungen anpassen. Es gilt die jeweils veröffentlichte Fassung. Stand: 2. November 2026.</p>`},

  const d=Q.d,E={},call=Q.tab==='call',dg=d.phone.replace(/\D/g,'');
  if(!d.first.trim())E.first='Bitte füllen Sie dieses Feld aus.';
  if(!/^[+\d][\d\s().\-\/]*$/.test(d.phone.trim())||dg.length<9||dg.length>15)E.phone='Bitte geben Sie eine gültige Telefonnummer ein.';
  if(!call){if(!d.co)E.co='Bitte wählen Sie eine Gesellschaft.';if(!d.pol)E.pol='Bitte wählen Sie die Art der Police.';if(d.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email.trim()))E.email='Bitte geben Sie eine gültige E-Mail-Adresse ein.'}
  if(!d.consent)E.consent=1;
  if(Object.keys(E).length){Q.err=E;renderQuick();const b=$('#qcard .bad input,#qcard .bad select');if(b)b.focus();return}
  Q.busy=true;Q.subErr='';renderQuick();
  const lead={lead_id:'PB-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase(),created_at:new Date().toISOString(),first_name:d.first.trim(),last_name:'',email:(d.email||'').trim(),phone:d.phone.trim(),canton:'',postal_code:'',
   preferred_language:call?d.lang:LANG,current_advisor_status:call?'Rückruf gewünscht':'Police in neue Betreuung geben',existing_policy_types:call?[]:[d.pol],service_interest:[call?'Rückruf':'Police direkt in neue Betreuung geben'],
   campaign_type:call?'rueckruf':'uebergabe',campaign_source:UTM.utm_source||'direct',campaign_medium:UTM.utm_medium||null,campaign_name:UTM.utm_campaign||null,landing_page:CUR||'start',lead_status:'Neu',assigned_partner:null,consent_version:'v1',consent_timestamp:new Date().toISOString(),marketing_opt_in:false,
   extra:{callback_window:call?QTIMES[+d.time]:null,insurer:call?null:d.co,policy_number:d.polnr||null}};
  try{await apiLeads(lead)}catch(e){Q.busy=false;Q.subErr=SUBERR;renderQuick();return}
  Q.busy=false;Q.done=true;Q.lead=lead;renderQuick();track('quick_submit_success',{type:lead.campaign_type,landing:CUR||'start'});
});

/* ===== Maklervollmacht: Schritt 7, Online-Unterschrift, Payload ===== */
const SIG={};
const todayCH=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
function mandantName(){const d=F.d;return (d.first+' '+d.last).trim()||'…'}
function mandateText(){
  const d=F.d,M=MANDATE,P=M.party;
  const areas=M.areas.filter(a=>d['mp_'+a[0]]).map(a=>a[0]==='other'&&d.mp_otherTxt?'andere: '+d.mp_otherTxt:a[1]);
  return {parties:`${mandantName()}, ${d.street||'…'}, ${d.zip} ${d.city||'…'}${d.m2?' und '+d.m2:''} (Mandant) – ${P.name}, ${P.addr} (${P.short})`,tasks:M.tasks,report:M.report[d.mrep!=null?d.mrep:0],areas,boxes:M.boxes.map(b=>b[0]+': '+b[1].replace(/<[^>]+>/g,' ')),place:d.mPlace,date:todayCH()};
}
function mandateHTML(){
  const d=F.d,M=MANDATE,P=M.party;
  const areas=M.areas.map(a=>`<li class="${d['mp_'+a[0]]?'on':''}">${d['mp_'+a[0]]?'☒':'☐'} ${esc(a[1])}${a[0]==='other'&&d.mp_otherTxt?': '+esc(d.mp_otherTxt):''}</li>`).join('');
  return `<div class="mandate" tabindex="0" aria-label="${esc(M.title)}"><h4>${esc(M.title)}</h4>
   <p><b>Zwischen</b><br>${esc(mandantName())}<br>${esc(d.street||'…')}, ${esc(d.zip)} ${esc(d.city||'…')}${d.m2?'<br>und '+esc(d.m2):''}<br><i>nachstehend <b>Mandant</b> genannt</i></p>
   <p><b>und der</b><br>${esc(P.name)}<br>${esc(P.addr)}<br><i>nachstehend <b>${esc(P.short)}</b> genannt</i></p>
   <p>${esc(M.intro)}</p><ul class="mt">${M.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}<li>Ein umfangreiches ${esc(M.report[d.mrep!=null?d.mrep:0])} Reporting</li></ul>
   <p><b>Betreffende Policen / Verträge / Bereiche</b></p><ul class="ma">${areas}</ul>
   ${M.boxes.map(b=>`<div class="mrow"><div class="mh">${esc(b[0])}</div><div class="mb">${b[1]}</div></div>`).join('')}
   <p>${esc(M.valid)}</p></div>`;
}
function mandateBody(){
  const d=F.d,e=F.err,M=MANDATE;
  const chk=(n,txt,extra='')=>`<label class="chk ${e[n]?'bad':''}"><input type="checkbox" name="${n}" ${d[n]?'checked':''}><span>${txt}</span></label>${e[n]?`<div class="ferr" role="alert" style="margin:-6px 0 12px 30px">${e[n]}</div>`:''}`;
  const sig=(k,l,hint)=>`<div class="sigfld ${e['sign'+k]?'bad':''}" id="sig${k}wrap" ${k==2&&!d.m2?'hidden':''}><label>${esc(l)}</label><div class="sigbox"><canvas id="sig${k}" data-k="${k}" aria-label="${esc(l)}: mit Finger oder Maus unterschreiben"></canvas><span class="sighint" ${d['sign'+k]?'hidden':''}>${esc(hint)}</span></div><div class="sigtools"><button type="button" class="link-arrow" data-action="sigclear" data-k="${k}">Unterschrift löschen</button></div>${e['sign'+k]?`<div class="ferr" role="alert">${e['sign'+k]}</div>`:''}</div>`;
  return `<p class="mand-lead">Damit wir Ihre Police(n) übernehmen können, füllen Sie das Maklermandat direkt hier aus und unterschreiben es online. Es geht vollständig an <b>${esc(M.to)}</b>. Sie können auch nur die Anfrage senden und die Vollmacht später erteilen.</p>
   <div class="fields">${fld('street','Strasse und Nr.','text',{full:1,ac:'street-address'})}${fld('zip','PLZ','text',{ac:'postal-code',im:'numeric'})}${fld('city','Ort','text',{ac:'address-level2'})}${fld('m2','Mandant/in 2 (optional, Name)','text',{full:1})}</div>
   <p class="mlabel">Betreffende Policen / Verträge / Bereiche</p>
   ${M.areas.map(a=>`<label class="chk"><input type="checkbox" name="mp_${a[0]}" ${d['mp_'+a[0]]?'checked':''}><span>${esc(a[1])}</span></label>`).join('')}
   <div class="fields" id="mp-other-wrap" ${d.mp_other?'':'hidden'}>${fld('mp_otherTxt','Andere, welche?','text',{full:1})}</div>
   <p class="mlabel">Reporting</p>${optList('mrep',M.report.map(r=>'Ein '+r+' Reporting'),false)}
   <p class="mlabel">Maklermandat (bitte vollständig lesen)</p><div id="mandate-live">${mandateHTML()}</div>
   <div class="fields" style="margin-top:14px">${fld('mPlace','Ort der Unterzeichnung','text',{ph:'z. B. Zürich'})}<div class="fld"><label>Datum</label><input type="text" value="${todayCH()}" readonly aria-readonly="true"></div></div>
   ${sig(1,'Unterschrift Mandant/in 1','Hier unterschreiben')}${sig(2,'Unterschrift Mandant/in 2','Hier unterschreiben')}
   <div class="sigfld"><label>Unterschrift ${esc(M.party.name)}</label><div class="sigbox static"><span class="sighint">Wird nach Prüfung und Annahme durch ${esc(M.party.name)} gegengezeichnet.</span></div></div>
   ${chk('mAgree','Ich habe das Maklermandat gelesen und bin damit einverstanden. Ich erteile ${M.party.name} Vollmacht und Auftrag wie oben beschrieben.'.replace('${M.party.name}',esc(M.party.name)))}
   ${chk('mAgb','Ich akzeptiere die <button type="button" class="inl" data-action="modal" data-m="agb">AGB</button> und bestätige, die <button type="button" class="inl" data-action="modal" data-m="vag45">Informationen gemäss Art. 45 VAG</button> erhalten zu haben.')}
   ${chk('mDs','Ich bin damit einverstanden, dass meine Angaben und das unterzeichnete Mandat gemäss <button type="button" class="inl" data-action="modal" data-m="privacy">Datenschutzhinweisen</button> an '+esc(M.to)+' übermittelt und von dort verarbeitet werden.')}
   <div class="ferr" id="mand-err" role="alert" ${Object.keys(e).some(k=>/^(sign|mAgree|mAgb|mDs)/.test(k))?'':'hidden'}>Bitte ergänzen Sie die markierten Angaben.</div>
   <div class="skip-row"><button type="button" class="link-arrow" data-action="fskip">Nur Anfrage senden, Vollmacht später erteilen</button></div>`;
}
function validateMandate(){
  const d=F.d,E={};
  if(!d.street.trim())E.street='Bitte ausfüllen.';
  if(!/^\d{4}$/.test(String(d.zip).trim()))E.zip='Bitte vierstellige PLZ.';
  if(!d.city.trim())E.city='Bitte ausfüllen.';
  if(d.mp_other&&!d.mp_otherTxt.trim())E.mp_otherTxt='Bitte angeben.';
  if(!d.mp_leben&&!d.mp_kap&&!d.mp_hyp&&!(d.mp_other&&d.mp_otherTxt.trim()))E.mp_leben='Bitte mindestens einen Bereich wählen.';
  if(!d.mPlace.trim())E.mPlace='Bitte ausfüllen.';
  if(!d.sign1)E.sign1='Bitte unterschreiben.';
  if(d.m2.trim()&&!d.sign2)E.sign2='Bitte unterschreiben.';
  if(!d.mAgree)E.mAgree='Bitte bestätigen.';
  if(!d.mAgb)E.mAgb='Bitte bestätigen.';
  if(!d.mDs)E.mDs='Bitte bestätigen.';
  return E;
}
/* Signatur-Pad */
function initSig(){
  [1,2].forEach(k=>{
    const c=$('#sig'+k);if(!c)return;
    const r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
    c.width=Math.max(300,r.width*dpr);c.height=Math.max(120,r.height*dpr);
    const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';
    x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--paper-ink-sig').trim()||'#0d1b3d';
    if(F.d['sign'+k]){const im=new Image();im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=F.d['sign'+k]}
    let down=false,last=null,moved=false;
    const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
    c.addEventListener('pointerdown',e=>{e.preventDefault();down=true;moved=false;last=pt(e);c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...last);x.lineTo(last[0]+.01,last[1]);x.stroke()});
    c.addEventListener('pointermove',e=>{if(!down)return;e.preventDefault();const p=pt(e);x.beginPath();x.moveTo(...last);x.lineTo(...p);x.stroke();last=p;moved=true;const h=c.parentNode.querySelector('.sighint');if(h)h.hidden=true});
    const end=()=>{if(!down)return;down=false;if(moved){F.d['sign'+k]=c.toDataURL('image/png');const w=$('#sig'+k+'wrap');if(w){w.classList.remove('bad');const er=$('.ferr',w);if(er)er.remove()}}};
    c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('pointerleave',end);
  });
}
function sigClear(k){F.d['sign'+k]=null;const c=$('#sig'+k);if(!c)return;c.getContext('2d').clearRect(0,0,c.width,c.height);const h=c.parentNode.querySelector('.sighint');if(h)h.hidden=false}
async function sha256(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return null}}
/* Payload, wie er serverseitig an anfrage@… gehen würde (Signaturbilder nur im Versandpaket, nicht im Browser-Speicher) */
async function buildMandatePayload(lead){
  const d=F.d,t=mandateText(),json=JSON.stringify(t);
  return {type:'maklermandat',version:MANDATE.ver,lead_id:lead.lead_id,to:MANDATE.to,signed_at:new Date().toISOString(),place:d.mPlace.trim(),date:t.date,
   party:MANDATE.party,mandant1:{name:mandantName(),street:d.street.trim(),zip:String(d.zip).trim(),city:d.city.trim(),email:d.email.trim(),phone:d.phone.trim()},mandant2:d.m2.trim()||null,
   areas:t.areas,reporting:t.report,consents:{mandate_read:true,agb_art45:true,data_transfer:true},text_sha256:await sha256(json),text_snapshot:t,
   signature1_png:d.sign1,signature2_png:d.m2.trim()?d.sign2:null,user_agent:navigator.userAgent};
}

function mandLive(n){
  const m=$('#mandate-live');if(m)m.innerHTML=mandateHTML();
  if(n==='m2'){const w=$('#sig2wrap');if(w)w.hidden=!F.d.m2.trim()}
  if(n==='mp_other'){const w=$('#mp-other-wrap');if(w)w.hidden=!F.d.mp_other}
}

/* ===== Cookie-Einwilligung ===== */
const GTM_ID=''; // z. B. 'GTM-XXXXXXX'; wird nur mit Statistik-Einwilligung geladen
function loadGoogle(){
  if(!GTM_ID||document.getElementById('gtm-s'))return;
  window.dataLayer=window.dataLayer||[];window.dataLayer.push({'gtm.start':Date.now(),event:'gtm.js'});
  const s=document.createElement('script');s.id='gtm-s';s.async=true;s.src='https://www.googletagmanager.com/gtm.js?id='+encodeURIComponent(GTM_ID);document.head.appendChild(s);
}
function setConsent(stat){
  CONSENT={stat:!!stat,ts:new Date().toISOString(),v:'cookies-v1'};store.set('pb_consent_v1',CONSENT);
  if(!CONSENT.stat){try{const u=JSON.parse(sessionStorage.getItem('pb_utm')||'{}');delete u.gclid;sessionStorage.setItem('pb_utm',JSON.stringify(u));delete UTM.gclid}catch(e){}}
  else loadGoogle();
  const el=$('#cookie');if(el){el.classList.remove('open');el.innerHTML=''}
}
function openCookies(detail){
  let el=$('#cookie');if(!el){el=document.createElement('div');el.id='cookie';document.body.appendChild(el)}
  const c=CONSENT;
  el.className='cookie open'+(detail?' detail':'');
  el.innerHTML=detail?`<div class="ck-card" role="dialog" aria-modal="false" aria-label="Cookie-Einstellungen"><h3>Cookie-Einstellungen</h3>
   <p>Wir setzen keine Cookies zur Wiedererkennung oder für Werbung. Sie entscheiden, ob wir die Wirkung unserer Anzeigen mit Google messen dürfen.</p>
   <div class="ck-row"><div><b>Notwendig</b><span>Zwischenspeicherung des Formulars im Browser, Anzeige der Startanimation, Ihre Cookie-Auswahl. Immer aktiv.</span></div><input type="checkbox" checked disabled aria-label="Notwendig, immer aktiv"></div>
   <div class="ck-row"><div><b>Statistik und Anzeigenmessung (Google)</b><span>Google Tag Manager und Google Ads. Übermittelt werden die Google-Klick-ID und Ereignisse wie «Formularschritt erreicht», nie Name, E-Mail, Telefonnummer oder Policendaten. Google kann Daten in die USA übermitteln.</span></div><label class="sw"><input type="checkbox" id="ck-stat" ${c&&c.stat?'checked':''}><i></i><span class="sr">Statistik erlauben</span></label></div>
   <div class="ck-btns"><button class="btn ghost sm" data-action="ck-nec">Nur notwendige</button><button class="btn sm" data-action="ck-save">Auswahl speichern</button></div>
   <p class="ck-foot"><button class="inl" data-action="modal" data-m="privacy">Datenschutzerklärung</button></p></div>`
  :`<div class="ck-card" role="dialog" aria-modal="false" aria-label="Cookie-Hinweis"><h3>Ihre Privatsphäre</h3>
   <p>Wir verwenden nur technisch notwendigen Speicher. Mit Ihrer Zustimmung messen wir zusätzlich mit Google den Erfolg unserer Anzeigen, ohne Name, E-Mail, Telefonnummer oder Policendaten zu übermitteln.</p>
   <div class="ck-btns"><button class="btn ghost sm" data-action="ck-nec">Nur notwendige</button><button class="btn ghost sm" data-action="ck-set">Einstellungen</button><button class="btn sm" data-action="ck-all">Alle akzeptieren</button></div>
   <p class="ck-foot"><button class="inl" data-action="modal" data-m="privacy">Datenschutzerklärung</button></p></div>`;
}
(function initConsent(){
  CONSENT=store.get('pb_consent_v1',null);
  if(!CONSENT){try{const u=JSON.parse(sessionStorage.getItem('pb_utm')||'{}');if(u.gclid){delete u.gclid;sessionStorage.setItem('pb_utm',JSON.stringify(u));delete UTM.gclid}}catch(e){}openCookies(false)}
  else if(CONSENT.stat)loadGoogle();
})();
